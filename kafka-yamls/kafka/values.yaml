image:
  repository: bitnamilegacy/kafka
  tag: latest
  pullPolicy: IfNotPresent

kraft:
  enabled: true

zookeeper:
  enabled: false

controller:
  replicaCount: 2
  automountServiceAccountToken: true
  controllerOnly: true

  nodeSelector:
    dedicated: kafka

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3

  updateStrategy:
    type: RollingUpdate

broker:
  replicaCount: 2
  automountServiceAccountToken: true

  readinessProbe:
    initialDelaySeconds: 40
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector:
    dedicated: kafka

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

  persistence:
    enabled: true
    size: 20Gi
    storageClass: gp3

  updateStrategy:
    type: RollingUpdate

listeners:
  client:
    name: CLIENT
    containerPort: 9092
    protocol: PLAINTEXT
  controller:
    name: CONTROLLER
    containerPort: 9093
    protocol: PLAINTEXT
  interbroker:
    name: INTERNAL
    containerPort: 9094
    protocol: PLAINTEXT
  securityProtocolMap: "CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT"

interBrokerListenerName: INTERNAL

controllerQuorumVoters: "0@kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.kafka.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.kafka.svc.cluster.local:9093"

defaultReplicationFactor: 3
offsetsTopicReplicationFactor: 3
transactionStateLogReplicationFactor: 3
transactionStateLogMinIsr: 2
minInsyncReplicas: 2

externalAccess:
  enabled: false

serviceAccount:
  create: true

rbac:
  create: true

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

