image:
  repository: bitnamilegacy/kafka
  tag: latest
  pullPolicy: IfNotPresent

kraft:
  enabled: true

zookeeper:
  enabled: false

controller:
  replicaCount: 2
  automountServiceAccountToken: true
  controllerOnly: true

  nodeSelector:
    dedicated: kafka

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3
  
  updateStrategy:
    type: RollingUpdate
    
broker:
  replicaCount: 2
  automountServiceAccountToken: true

  readinessProbe:
    initialDelaySeconds: 40
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector:
    dedicated: kafka

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3
  
  updateStrategy:
    type: RollingUpdate


listeners:
  client:
    name: CLIENT
    containerPort: 9092
    protocol: PLAINTEXT
  controller:
    name: CONTROLLER
    containerPort: 9093
    protocol: PLAINTEXT
  interbroker:
    name: INTERNAL
    containerPort: 9094
    protocol: PLAINTEXT
  external:
    name: EXTERNAL
    containerPort: 9095
    protocol: SSL
    sslClientAuth: "none"
  securityProtocolMap: "CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SSL"
  advertisedListeners: "CLIENT://kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9092,INTERNAL://kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9094,EXTERNAL://bootstrap.kafka.internal:9095"

externalAccess:
  enabled: true
  broker:
    service:
      type: LoadBalancer
      ports:
        external: 9095
      domain: bootstrap.kafka.internal

defaultInitContainers:
  autoDiscovery:
    enabled: false


    image:
      registry: docker.io
      repository: bitnamilegacy/kubectl
      tag: 1.33.4-debian-12-r0


serviceAccount:
  create: true

rbac:
  create: true
  

interBrokerListenerName: INTERNAL

controllerQuorumVoters: "0@kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local:9093"

# controllerQuorumVoters: |
#   0@kafka-controller-0.kafka-controller-headless:9093,
#   1@kafka-controller-1.kafka-controller-headless:9093,
#   2@kafka-controller-2.kafka-controller-headless:9093


# defaultReplicationFactor: 3
# offsetsTopicReplicationFactor: 3
# transactionStateLogReplicationFactor: 3
# transactionStateLogMinIsr: 2
# minInsyncReplicas: 2

defaultReplicationFactor: 1
offsetsTopicReplicationFactor: 1
transactionStateLogReplicationFactor: 1
transactionStateLogMinIsr: 1
minInsyncReplicas: 1

tls:
  type: PEM
  existingSecret: kafka-tls
  autoGenerated:
    enabled: false
  sslClientAuth: "none"

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
