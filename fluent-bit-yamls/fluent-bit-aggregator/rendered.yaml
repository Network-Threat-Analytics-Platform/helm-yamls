# Source: fluent-bit-aggregator/templates/configmap-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-fluent-bit-aggregator-config
  namespace: kafka
  labels:
    helm.sh/chart: fluent-bit-aggregator-1.0.0-beta.3
    app.kubernetes.io/name: fluent-bit-aggregator
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/version: "4.2.3"
    app.kubernetes.io/managed-by: Helm
data:
  fluent-bit.yaml: |-
    env:
      ADDITIONAL_PORT_0: "24224"
      STORAGE_PATH: "/fluent-bit/data"
    includes: []
    multiline_parsers: []
    parsers:
    - format: json
      name: json
    pipeline:
      filters:
      - key_name: log
        match: zeek.*
        name: parser
        parser: json
        preserve_key: false
        reserve_data: true
      - key_name: log
        match: suricata_eve.log
        name: parser
        parser: json
        preserve_key: false
        reserve_data: true
      - call: add_time
        match: zeek.*
        name: lua
        script: /fluent-bit/scripts/add_time.lua
      - call: add_ingest_time_suricata
        match: suricata_eve.log
        name: lua
        script: /fluent-bit/scripts/add_ingest_time_suricata.lua
      - match: zeek.conn
        name: record_modifier
        record:
        - log_source zeek.conn
        - pipeline_stage bronze
      - match: zeek.http
        name: record_modifier
        record:
        - log_source zeek.http
        - pipeline_stage bronze
      - match: zeek.dns
        name: record_modifier
        record:
        - log_source zeek.dns
        - pipeline_stage bronze
      - match: zeek.ssl
        name: record_modifier
        record:
        - log_source zeek.ssl
        - pipeline_stage bronze
      - match: suricata_eve.log
        name: record_modifier
        record:
        - log_source suricata
        - pipeline_stage bronze
      inputs:
      - alias: in
        buffer_chunk_size: 1M
        buffer_max_size: 6M
        listen: 0.0.0.0
        name: forward
        port: ${ADDITIONAL_PORT_0}
        storage.type: filesystem
      outputs:
      - alias: out
        match: '*'
        name: stdout
      - alias: out-zeek-conn
        brokers: kafka:9092
        format: json
        match: zeek.conn
        name: kafka
        topics: zeek-conn
      - alias: out-zeek-http
        brokers: kafka:9092
        format: json
        match: zeek.http
        name: kafka
        topics: zeek-http
      - alias: out-zeek-dns
        brokers: kafka:9092
        format: json
        match: zeek.dns
        name: kafka
        topics: zeek-dns
      - alias: out-zeek-ssl
        brokers: kafka:9092
        format: json
        match: zeek.ssl
        name: kafka
        topics: zeek-ssl
      - alias: out-zeek-unified
        brokers: kafka:9092
        format: json
        match: zeek.*
        name: kafka
        net.keepalive: true
        net.keepalive_idle_timeout: 30
        topics: zeek-unified
      - alias: out-suricata
        brokers: kafka:9092
        format: json
        match: suricata_eve.log
        name: kafka
        net.keepalive: true
        net.keepalive_idle_timeout: 30
        topics: suricata-eve
    plugins: []
    service:
      daemon: false
      hot_reload: false
      http_Port: 2020
      http_listen: 0.0.0.0
      http_server: true
      log_level: info
      storage.path: ${STORAGE_PATH}
    upstream_servers: []
