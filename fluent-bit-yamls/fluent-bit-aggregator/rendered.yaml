metadata:
  name: fluent-bit-fluent-bit-aggregator
  namespace: kafka
  labels:
    helm.sh/chart: fluent-bit-aggregator-1.0.0-beta.3
    app.kubernetes.io/name: fluent-bit-aggregator
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/version: "4.2.3"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: fluent-bit-fluent-bit-aggregator-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit-aggregator
      app.kubernetes.io/instance: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit-aggregator
        app.kubernetes.io/instance: fluent-bit
      annotations:
        checksum/config: 65c6a55be952b02070a17537fb14e093fede315eeb9ae46087176e6a0b2c836a
        checksum/scripts: 2236fdf4c080e23cfedb98d07281e770016bbfcf29688b280a6361ddf11d2ede
    spec:
      serviceAccountName: fluent-bit-fluent-bit-aggregator
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aggregator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: false
            runAsUser: 65532
          image: ghcr.io/fluent/fluent-bit:4.2.3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: ADDITIONAL_PORT_HTTP_FORWARD
              value: "24224"
            - name: CONFIG_PATH
              value: /fluent-bit/etc/conf
            - name: STORAGE_PATH
              value: /fluent-bit/data
            - name: SCRIPTS_PATH
              value: /fluent-bit/scripts
          command:
            - /fluent-bit/bin/fluent-bit
          args:
            - --workdir=/fluent-bit/etc
            - --config=/fluent-bit/etc/conf/fluent-bit.yaml
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
            - name: http-forward
              containerPort: 24224
              protocol: TCP
          livenessProbe:
            failureThreshold: 12
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/conf
            - name: scripts
              mountPath: /fluent-bit/scripts
            - name: data
              mountPath: /fluent-bit/data
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: fluent-bit-fluent-bit-aggregator-config
        - name: scripts
          configMap:
            name: fluent-bit-fluent-bit-aggregator-scripts
        - name: data
          emptyDir: {}
      nodeSelector:
        dedicated: kafka
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: kafka
