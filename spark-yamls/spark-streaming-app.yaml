apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: build-silver-data
  namespace: spark-apps
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 790813558211.dkr.ecr.ap-northeast-2.amazonaws.com/spark-apps/streaming:2.6.1-cm-20260429-224752
  
  imagePullPolicy: Always

  mainApplicationFile: local:///opt/spark/app/main.py
  sparkVersion: "3.5.7"
  sparkConf:
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.AbstractFileSystem.s3a.impl": "org.apache.hadoop.fs.s3a.S3A"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://malware-project-bucket/silver/spark-event-logs/"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.shuffle.partitions": "64"

    "spark.dynamicAllocation.enabled": "true"
    "spark.dynamicAllocation.shuffleTracking.enabled": "true"
    "spark.dynamicAllocation.minExecutors": "1"
    "spark.dynamicAllocation.initialExecutors": "1"
    "spark.dynamicAllocation.maxExecutors": "10"
    "spark.dynamicAllocation.executorIdleTimeout": "60s"

    # spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    # spark.sql.catalog.glue_catalog: org.apache.iceberg.spark.SparkCatalog
    # spark.sql.catalog.glue_catalog.warehouse: s3://malware-project-bucket/warehouse/
    # spark.sql.catalog.glue_catalog.catalog-impl: org.apache.iceberg.aws.glue.GlueCatalog
    # spark.sql.catalog.glue_catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO

  driver:
    serviceAccount: spark-sa
    cores: 1
    memory: "2g"
    nodeSelector:
      dedicated: spark
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "spark"
        effect: "NoSchedule"
    env:
      - name: TRIGGER_INTERVAL
        valueFrom:
          configMapKeyRef:
            name: silver-job-config
            key: TRIGGER_INTERVAL
      - name: STARTING_OFFSETS
        valueFrom:
          configMapKeyRef:
            name: silver-job-config
            key: STARTING_OFFSETS

  executor:
    instances: 2
    cores: 1
    memory: "4g"
    nodeSelector:
      dedicated: spark
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "spark"
        effect: "NoSchedule"
    env:
      - name: TRIGGER_INTERVAL
        valueFrom:
          configMapKeyRef:
            name: silver-job-config
            key: TRIGGER_INTERVAL
      - name: STARTING_OFFSETS
        valueFrom:
          configMapKeyRef:
            name: silver-job-config
            key: STARTING_OFFSETS
