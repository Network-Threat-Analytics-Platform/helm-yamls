kind: Secret
metadata:
  name: airflow-connections
  namespace: airflow
  labels:
    app: airflow
    component: connections
type: Opaque
stringData:
  # AWS Connection (S3 로그용 - IRSA 사용)
  AIRFLOW_CONN_AWS_DEFAULT: "aws:///?region_name=ap-northeast-2"
  AIRFLOW_CONN_NEO4J_DEFAULT: "neo4j://neo4j:liam%40%2109@neo4j.neo4j.svc.cluster.local:7687"
  
